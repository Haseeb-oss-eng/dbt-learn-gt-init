models:
  - name: stg_jaffle_shop__customers  # generic : unique and not null test of customer table
    columns:
      - name: customer_id        # use alias named
        data_tests:
          - not_null
          - unique  
  
  - name: stg_jaffle_shop__orders # generic : unique and not null test of order table
    columns:
      - name: order_id        # use alias named
        data_tests:
          - not_null
          - unique   
      - name: status # accepted values test of order table 
        data_tests:
          - accepted_values:
              arguments:
                values: ['placed', 'shipped', 'returned', 'completed', 'return_pending']
      - name: customer_id # foreign key test of order table
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_jaffle_shop__customers')
                field: customer_id